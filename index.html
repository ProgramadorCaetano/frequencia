<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minha Webrádio</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="radio-container">
    <h1>📻 Minha Frequência WebRádio</h1>
    <p id="track-title">Carregando programação...</p>
    
    <audio id="audio-player" controls></audio>
    
    <div class="controls">
      <button onclick="prevTrack()">⏮ Anterior</button>
      <button onclick="nextTrack()">⏭ Próxima</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
